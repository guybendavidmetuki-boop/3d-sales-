<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Print Cloud Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: white; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .tab-content { display: none; animation: slideUp 0.3s ease-out; }
        .tab-content.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input, select { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; padding: 14px !important; border-radius: 18px !important; outline: none; width: 100%; font-size: 16px; }
        input:focus { border-color: #38bdf8 !important; }
        .nav-btn.active { color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
    </style>
</head>
<body class="pb-32">

    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 glass px-6 py-3 rounded-full text-xs font-bold opacity-0 transition-all z-[200] pointer-events-none border-sky-500/30"></div>

    <div id="app" class="max-w-md mx-auto p-6 pt-10">
        
        <!-- Login Screen -->
        <div id="loginScreen" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-6">
            <div class="glass p-10 rounded-[40px] w-full max-w-sm text-center border-white/5">
                <div class="w-20 h-20 bg-sky-500 rounded-3xl mx-auto mb-6 flex items-center justify-center shadow-lg shadow-sky-500/20">
                    <i data-lucide="cloud" class="w-10 h-10 text-white"></i>
                </div>
                <h2 class="text-3xl font-black mb-10 tracking-tight">3D Cloud Sync</h2>
                <div class="grid gap-4">
                    <button onclick="loginUser('עמוס')" class="p-5 rounded-2xl bg-white/5 text-xl font-bold border border-white/10 active:scale-95 transition-all hover:bg-white/10">עמוס</button>
                    <button onclick="loginUser('מעיין')" class="p-5 rounded-2xl bg-white/5 text-xl font-bold border border-white/10 active:scale-95 transition-all hover:bg-white/10">מעיין</button>
                </div>
            </div>
        </div>

        <header class="flex justify-between items-end mb-10 px-2">
            <div>
                <p id="currentUserDisplay" class="text-sky-400 text-[10px] font-black mb-1 uppercase tracking-widest"></p>
                <h1 class="text-3xl font-black tracking-tighter">ניהול ענן</h1>
            </div>
            <button onclick="logout()" class="w-10 h-10 glass rounded-xl flex items-center justify-center text-slate-500 border-white/5">
                <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
        </header>

        <!-- Sales Tab -->
        <div id="tab-sales" class="tab-content active space-y-6">
            <section class="glass p-6 rounded-[30px] space-y-4 border-white/5 shadow-xl">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">מכירה חדשה</h3>
                <input type="text" id="orderCust" placeholder="שם הלקוח">
                <input type="tel" id="orderPhone" placeholder="טלפון">
                <select id="orderItemSelect"><option value="">טוען מוצרים...</option></select>
                <input type="number" id="orderPaid" placeholder="כמה שולם?">
                <button onclick="addOrder()" class="w-full bg-sky-500 py-4 rounded-2xl font-black shadow-lg shadow-sky-500/30 flex justify-center items-center gap-2 active:scale-[0.98] transition-transform">
                    <span>שמור לענן</span>
                    <i data-lucide="cloud-upload" class="w-5 h-5"></i>
                </button>
            </section>
            <div id="orderList" class="space-y-4"></div>
        </div>

        <!-- Production Tab -->
        <div id="tab-prod" class="tab-content space-y-4">
            <h2 class="text-xl font-bold text-sky-400 px-2">תור הדפסות חי</h2>
            <div id="prodList" class="space-y-3"></div>
        </div>

        <!-- Catalog Tab -->
        <div id="tab-catalog" class="tab-content space-y-6">
            <section class="glass p-6 rounded-[30px] space-y-4 border-white/5">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">דגם חדש</h3>
                    <span class="text-[10px] bg-sky-500/10 text-sky-400 px-3 py-1 rounded-full font-black border border-sky-500/20">עד 15₪</span>
                </div>
                <input type="text" id="catName" placeholder="שם הדגם">
                <div class="flex gap-2">
                    <button onclick="suggestPrice()" id="priceAiBtn" class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-4 rounded-xl text-xs font-bold whitespace-nowrap">הצע מחיר ✨</button>
                    <input type="number" id="catPrice" placeholder="מחיר (₪)" class="flex-1">
                </div>
                <div id="imagePreview" class="min-h-[120px] glass rounded-2xl flex items-center justify-center overflow-hidden border-2 border-dashed border-white/5 text-slate-600 text-[10px] italic">התמונה תופיע כאן</div>
                <button onclick="generateAiImage()" id="imageAiBtn" class="w-full glass border-emerald-500/20 text-emerald-400 py-3 rounded-xl text-xs font-bold active:bg-emerald-500/5">🖼️ צור תמונה עם AI</button>
                <button onclick="addCatalogItem()" class="w-full bg-emerald-500 py-4 rounded-2xl font-black shadow-lg shadow-emerald-500/20">הוסף לקטלוג המשותף</button>
            </section>
            <div id="catalogList" class="space-y-3"></div>
        </div>

        <!-- Money Tab -->
        <div id="tab-money" class="tab-content space-y-6">
            <div class="glass p-8 rounded-[40px] text-center border-white/5 shadow-2xl bg-gradient-to-b from-slate-900/50 to-transparent">
                <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">מאזן משותף</h3>
                <div id="stat-profit" class="text-6xl font-black text-emerald-400 mb-4 tracking-tighter">0 ₪</div>
                <div class="grid grid-cols-2 gap-4 border-t border-white/5 pt-6">
                    <div><div class="text-[10px] text-slate-500 uppercase">הכנסות</div><div id="stat-revenue" class="font-bold text-lg text-white">0 ₪</div></div>
                    <div><div class="text-[10px] text-slate-500 uppercase">הוצאות</div><div id="stat-expenses" class="font-bold text-lg text-rose-400">0 ₪</div></div>
                </div>
            </div>
            <section class="glass p-6 rounded-[30px] space-y-4 border-white/5">
                <h3 class="text-xs font-bold text-rose-400 uppercase tracking-wider">רישום הוצאה</h3>
                <input type="text" id="expName" placeholder="מה נקנה?">
                <input type="number" id="expPrice" placeholder="מחיר?">
                <button onclick="addExpense()" class="w-full bg-rose-500 py-4 rounded-2xl font-black shadow-lg shadow-rose-500/20">רשום הוצאה</button>
            </section>
        </div>
    </div>

    <nav class="fixed bottom-6 left-6 right-6 h-20 glass rounded-[28px] flex justify-around items-center px-4 z-50 border-white/10 shadow-2xl">
        <button onclick="switchTab('sales')" class="nav-btn p-3 rounded-2xl active" data-tab="sales"><i data-lucide="shopping-cart"></i></button>
        <button onclick="switchTab('prod')" class="nav-btn p-3 rounded-2xl text-slate-500" data-tab="prod"><i data-lucide="printer"></i></button>
        <button onclick="switchTab('catalog')" class="nav-btn p-3 rounded-2xl text-slate-500" data-tab="catalog"><i data-lucide="package"></i></button>
        <button onclick="switchTab('money')" class="nav-btn p-3 rounded-2xl text-slate-500" data-tab="money"><i data-lucide="wallet"></i></button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Configuration
        const FB_CONFIG = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const GEMINI_KEY = ""; 
        const APP_ID = "3d-print-cloud-v1";

        let db = null;
        let auth = null;
        let isOnline = false;

        window.state = {
            user: localStorage.getItem('3d_user') || null,
            products: JSON.parse(localStorage.getItem('cache_products') || '[]'),
            orders: JSON.parse(localStorage.getItem('cache_orders') || '[]'),
            expenses: JSON.parse(localStorage.getItem('cache_expenses') || '[]'),
            tempImage: null
        };

        const init = async () => {
            if (FB_CONFIG) {
                try {
                    const app = initializeApp(FB_CONFIG);
                    db = getFirestore(app);
                    auth = getAuth(app);
                    
                    // Crucial: Wait for Auth before starting listeners to avoid permission-denied
                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            isOnline = true;
                            setupRealtime();
                        }
                    });
                    await signInAnonymously(auth);
                } catch (e) {
                    console.error("Firebase Auth Error:", e);
                    window.toast("שגיאת חיבור לענן");
                    render();
                }
            } else {
                render();
            }
        };

        function setupRealtime() {
            const base = ['artifacts', APP_ID, 'public', 'data'];
            
            // Listeners with error handling
            onSnapshot(collection(db, ...base, 'products'), s => {
                window.state.products = s.docs.map(d => ({id: d.id, ...d.data()}));
                localStorage.setItem('cache_products', JSON.stringify(window.state.products));
                render();
            }, e => console.warn("Products sync error:", e));

            onSnapshot(collection(db, ...base, 'orders'), s => {
                window.state.orders = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b)=>b.timestamp-a.timestamp);
                localStorage.setItem('cache_orders', JSON.stringify(window.state.orders));
                render();
            }, e => console.warn("Orders sync error:", e));

            onSnapshot(collection(db, ...base, 'expenses'), s => {
                window.state.expenses = s.docs.map(d => ({id: d.id, ...d.data()}));
                localStorage.setItem('cache_expenses', JSON.stringify(window.state.expenses));
                render();
            }, e => console.warn("Expenses sync error:", e));
        }

        window.loginUser = (n) => {
            window.state.user = n;
            localStorage.setItem('3d_user', n);
            document.getElementById('loginScreen').style.display = 'none';
            render();
        };

        window.logout = () => { localStorage.removeItem('3d_user'); location.reload(); };

        window.toast = (m) => {
            const t = document.getElementById('toast'); t.innerText = m; t.style.opacity = 1; t.style.transform = "translate(-50%, 0)";
            setTimeout(() => { t.style.opacity = 0; t.style.transform = "translate(-50%, 20px)"; }, 2500);
        };

        window.suggestPrice = async () => {
            const name = document.getElementById('catName').value;
            if(!name) return window.toast("הכנס שם דגם");
            const btn = document.getElementById('priceAiBtn');
            btn.innerText = "...";
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Suggest price in ILS for 3D printed ${name}. ONLY number between 5-15.` }] }] })
                });
                const data = await res.json();
                let p = parseInt(data.candidates[0].content.parts[0].text.match(/\d+/)[0]) || 10;
                p = Math.min(15, Math.max(5, p));
                document.getElementById('catPrice').value = p;
            } catch (e) { 
                document.getElementById('catPrice').value = 12;
                window.toast("הצעה אוטומטית: 12₪"); 
            }
            btn.innerText = "הצע מחיר ✨";
        };

        window.generateAiImage = () => {
            const name = document.getElementById('catName').value;
            if(!name) return window.toast("הכנס שם דגם");
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = '<div class="animate-pulse text-sky-400">יוצר...</div>';
            setTimeout(() => {
                window.state.tempImage = `https://placehold.co/400x400/0f172a/38bdf8?text=${encodeURIComponent(name)}`;
                preview.innerHTML = `<img src="${window.state.tempImage}" class="w-full h-full object-cover">`;
                window.toast("תמונה מוכנה");
            }, 800);
        };

        window.addCatalogItem = async () => {
            const name = document.getElementById('catName').value;
            let price = parseFloat(document.getElementById('catPrice').value);
            if(!name || !price) return window.toast("חסרים פרטים");
            price = Math.min(15, price);
            const item = { name, price, image: window.state.tempImage, timestamp: Date.now() };
            if(isOnline) {
                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'products'), item);
            } else {
                window.state.products.push(item);
                localStorage.setItem('cache_products', JSON.stringify(window.state.products));
                render();
            }
            document.getElementById('catName').value = ""; document.getElementById('catPrice').value = "";
            window.state.tempImage = null;
            document.getElementById('imagePreview').innerHTML = "התמונה תופיע כאן";
            window.toast("נוסף בהצלחה!");
        };

        window.addOrder = async () => {
            const cust = document.getElementById('orderCust').value;
            const select = document.getElementById('orderItemSelect');
            if(!cust || !select.value) return window.toast("מלא פרטים");
            const order = {
                customer: cust, item: select.options[select.selectedIndex].text.split(' (')[0],
                cost: parseFloat(select.value), paid: parseFloat(document.getElementById('orderPaid').value) || 0,
                phone: document.getElementById('orderPhone').value, timestamp: Date.now(),
                date: new Date().toLocaleDateString('he-IL'), seller: window.state.user, printer: "⏳"
            };
            if(isOnline) {
                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'orders'), order);
            } else {
                window.state.orders.unshift(order);
                localStorage.setItem('cache_orders', JSON.stringify(window.state.orders));
                render();
            }
            document.getElementById('orderCust').value = ""; document.getElementById('orderPaid').value = ""; document.getElementById('orderPhone').value = "";
            window.toast("הזמנה נשמרה");
        };

        window.addExpense = async () => {
            const name = document.getElementById('expName').value;
            const price = parseFloat(document.getElementById('expPrice').value);
            if(!name || !price) return window.toast("מלא פרטים");
            const exp = { name, price, buyer: window.state.user, timestamp: Date.now() };
            if(isOnline) {
                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'expenses'), exp);
            } else {
                window.state.expenses.push(exp);
                localStorage.setItem('cache_expenses', JSON.stringify(window.state.expenses));
                render();
            }
            document.getElementById('expName').value = ""; document.getElementById('expPrice').value = "";
            window.toast("הוצאה נרשמה");
        };

        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active', 'text-sky-400'));
            document.querySelector(`[data-tab="${id}"]`).classList.add('active', 'text-sky-400');
        };

        window.render = () => {
            if(!window.state.user) {
                document.getElementById('loginScreen').style.display = 'flex';
                return;
            }
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('currentUserDisplay').innerText = `מחובר: ${window.state.user}`;
            
            // Sync products select
            const s = document.getElementById('orderItemSelect');
            s.innerHTML = '<option value="">בחר מוצר...</option>' + 
                window.state.products.map(p => `<option value="${p.price}">${p.name} (${p.price}₪)</option>`).join('');
            
            // Orders List
            document.getElementById('orderList').innerHTML = window.state.orders.map(o => `
                <div class="glass p-5 rounded-3xl border-r-4 ${o.paid >= o.cost ? 'border-emerald-500' : 'border-rose-500'}">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-black text-lg">${o.customer}</div>
                            <div class="text-[10px] text-sky-400 font-bold uppercase tracking-tight">${o.item}</div>
                        </div>
                        <div class="text-right">
                            <div class="font-black text-xl">${o.paid}/${o.cost}₪</div>
                            <div class="text-[9px] text-slate-500">${o.date}</div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Production List
            document.getElementById('prodList').innerHTML = window.state.orders.map(o => `
                <div class="glass p-4 rounded-2xl flex justify-between items-center">
                    <div>
                        <div class="font-bold text-sm">${o.item}</div>
                        <div class="text-[10px] text-slate-500 italic">${o.customer}</div>
                    </div>
                    <div class="text-[10px] font-bold bg-white/5 px-3 py-1 rounded-lg">${o.printer}</div>
                </div>
            `).join('');

            // Catalog List
            document.getElementById('catalogList').innerHTML = window.state.products.map(p => `
                <div class="glass p-3 rounded-2xl flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-slate-800 overflow-hidden flex-shrink-0">
                        <img src="${p.image || 'https://placehold.co/100'}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 font-bold text-sm">${p.name}</div>
                    <div class="text-emerald-400 font-black">${p.price}₪</div>
                </div>
            `).join('');

            // Stats
            const r = window.state.orders.reduce((a,b)=>a+(b.paid||0),0);
            const e = window.state.expenses.reduce((a,b)=>a+(b.price||0),0);
            document.getElementById('stat-profit').innerText = (r - e) + " ₪";
            document.getElementById('stat-revenue').innerText = r + " ₪";
            document.getElementById('stat-expenses').innerText = e + " ₪";
            lucide.createIcons();
        };

        init();
    </script>
</body>
</html>
