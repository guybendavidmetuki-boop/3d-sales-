<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Print Cloud Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617; 
            color: white; 
            -webkit-tap-highlight-color: transparent; 
        }
        .glass { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        .tab-content { 
            display: none; 
            animation: slideUp 0.4s ease-out; 
        }
        .tab-content.active { 
            display: block; 
        }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        input, select { 
            background: #0f172a !important; 
            border: 1px solid #1e293b !important; 
            color: white !important; 
            padding: 14px !important; 
            border-radius: 18px !important; 
            outline: none; 
            width: 100%;
        }
        input:focus { border-color: #38bdf8 !important; }
        .nav-btn.active { color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
    </style>
</head>
<body class="pb-32">

    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 glass px-6 py-3 rounded-full text-xs font-bold opacity-0 transition-all z-[200] pointer-events-none border-sky-500/30"></div>

    <div id="app" class="max-w-md mx-auto p-6 pt-10">
        
        <!-- Login Screen -->
        <div id="loginScreen" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-6" style="display: flex;">
            <div class="glass p-10 rounded-[40px] w-full max-w-sm text-center">
                <div class="w-20 h-20 bg-sky-500 rounded-3xl mx-auto mb-6 flex items-center justify-center shadow-lg shadow-sky-500/20">
                    <i data-lucide="cloud" class="w-10 h-10 text-white"></i>
                </div>
                <h2 class="text-3xl font-black mb-10">3D Cloud Sync</h2>
                <div class="grid gap-4">
                    <button onclick="loginUser('עמוס')" class="p-5 rounded-2xl bg-white/5 text-xl font-bold border border-white/5 active:scale-95 transition-all">עמוס</button>
                    <button onclick="loginUser('מעיין')" class="p-5 rounded-2xl bg-white/5 text-xl font-bold border border-white/5 active:scale-95 transition-all">מעיין</button>
                </div>
            </div>
        </div>

        <header class="flex justify-between items-end mb-10 px-2">
            <div>
                <p id="currentUserDisplay" class="text-sky-400 text-[10px] font-black mb-1 uppercase tracking-widest"></p>
                <h1 class="text-3xl font-black tracking-tighter">ניהול ענן</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="logout()" class="w-10 h-10 glass rounded-xl flex items-center justify-center text-slate-500 active:scale-90 transition-transform">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <div id="tab-sales" class="tab-content active space-y-6">
            <section class="glass p-6 rounded-[30px] space-y-4">
                <h3 class="text-sm font-bold text-slate-400">מכירה חדשה</h3>
                <input type="text" id="orderCust" placeholder="שם הלקוח">
                <input type="tel" id="orderPhone" placeholder="טלפון">
                <select id="orderItemSelect">
                    <option value="">טוען קטלוג משותף...</option>
                </select>
                <input type="number" id="orderPaid" placeholder="כמה שולם?">
                <button id="addOrderBtn" onclick="addOrder()" class="w-full bg-sky-500 py-4 rounded-2xl font-black shadow-lg shadow-sky-500/20 flex justify-center items-center gap-2">
                    <span>שמור לענן</span>
                    <i data-lucide="cloud-upload" class="w-5 h-5"></i>
                </button>
            </section>
            <div id="orderList" class="space-y-4"></div>
        </div>

        <div id="tab-prod" class="tab-content space-y-4">
            <h2 class="text-xl font-bold text-sky-400 px-2">תור הדפסות חי</h2>
            <div id="prodList" class="space-y-3"></div>
        </div>

        <div id="tab-catalog" class="tab-content space-y-6">
            <section class="glass p-6 rounded-[30px] space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-slate-400">הוספת דגם לקטלוג</h3>
                    <span class="text-[9px] bg-sky-500/10 text-sky-400 px-2 py-1 rounded-md font-bold">מגבלה: 15₪</span>
                </div>
                <input type="text" id="catName" placeholder="שם הדגם">
                <div class="flex gap-2">
                    <button onclick="suggestPrice()" id="priceAiBtn" class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 rounded-xl text-[10px] font-bold">הצע מחיר ✨</button>
                    <input type="number" id="catPrice" placeholder="מחיר (₪)" class="flex-1">
                </div>
                <div id="imagePreview" class="min-h-[120px] glass rounded-2xl flex items-center justify-center overflow-hidden border-2 border-dashed border-white/5 text-slate-600 text-[10px]">התמונה תופיע כאן</div>
                <button id="imageAiBtn" onclick="generateAiImage()" class="w-full glass border-emerald-500/20 text-emerald-400 py-3 rounded-xl text-xs font-bold">🖼️ צור תמונה עם AI</button>
                <button id="addCatBtn" onclick="addCatalogItem()" class="w-full bg-emerald-500 py-4 rounded-2xl font-black">הוסף לקטלוג לכולם</button>
            </section>
            <div id="catalogList" class="space-y-3"></div>
        </div>

        <div id="tab-money" class="tab-content space-y-6">
            <div class="glass p-8 rounded-[40px] text-center border-white/10 shadow-2xl">
                <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">מאזן משותף</h3>
                <div id="stat-profit" class="text-6xl font-black text-emerald-400 tracking-tighter mb-4">0 ₪</div>
                <div class="grid grid-cols-2 gap-4 border-t border-white/5 pt-6">
                    <div>
                        <div class="text-[10px] text-slate-500">סה"כ הכנסות</div>
                        <div id="stat-revenue" class="font-bold text-white">0 ₪</div>
                    </div>
                    <div>
                        <div class="text-[10px] text-slate-500">סה"כ הוצאות</div>
                        <div id="stat-expenses" class="font-bold text-rose-400">0 ₪</div>
                    </div>
                </div>
            </div>
            <section class="glass p-6 rounded-[30px] space-y-4">
                <h3 class="text-sm font-bold text-rose-400">רישום הוצאה משותפת</h3>
                <input type="text" id="expName" placeholder="מה נקנה?">
                <input type="number" id="expPrice" placeholder="מחיר?">
                <button onclick="addExpense()" class="w-full bg-rose-500 py-4 rounded-2xl font-black">רשום הוצאה</button>
            </section>
        </div>

    </div>

    <!-- Navigation -->
    <nav class="fixed bottom-6 left-6 right-6 h-20 glass rounded-[28px] flex justify-around items-center px-4 z-50 shadow-2xl border-white/10">
        <button onclick="switchTab('sales')" class="nav-btn p-3 rounded-2xl active" data-tab="sales">
            <i data-lucide="shopping-cart" class="w-6 h-6"></i>
        </button>
        <button onclick="switchTab('prod')" class="nav-btn p-3 rounded-2xl text-slate-500" data-tab="prod">
            <i data-lucide="printer" class="w-6 h-6"></i>
        </button>
        <button onclick="switchTab('catalog')" class="nav-btn p-3 rounded-2xl text-slate-500" data-tab="catalog">
            <i data-lucide="package" class="w-6 h-6"></i>
        </button>
        <button onclick="switchTab('money')" class="nav-btn p-3 rounded-2xl text-slate-500" data-tab="money">
            <i data-lucide="wallet" class="w-6 h-6"></i>
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : '3d-print-cloud-v1';
        const apiKey = ""; 

        window.state = {
            user: localStorage.getItem('3d_user') || null,
            products: [],
            orders: [],
            expenses: [],
            tempImage: null
        };

        // --- AUTH LOGIC (RULE 3) ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth failed:", err);
            }
        };
        initAuth();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                setupRealtimeListeners();
                if(window.state.user) document.getElementById('loginScreen').style.display = 'none';
            }
        });

        function setupRealtimeListeners() {
            if (!auth.currentUser) return; // Guard clause
            
            const base = ['artifacts', appId, 'public', 'data'];
            
            onSnapshot(collection(db, ...base, 'products'), (s) => { 
                window.state.products = s.docs.map(d=>({id:d.id,...d.data()})); 
                render(); 
            }, (err) => console.error("Products error:", err));

            onSnapshot(collection(db, ...base, 'orders'), (s) => { 
                window.state.orders = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.timestamp-a.timestamp); 
                render(); 
            }, (err) => console.error("Orders error:", err));

            onSnapshot(collection(db, ...base, 'expenses'), (s) => { 
                window.state.expenses = s.docs.map(d=>({id:d.id,...d.data()})); 
                render(); 
            }, (err) => console.error("Expenses error:", err));
        }

        window.loginUser = (n) => { 
            window.state.user = n; 
            localStorage.setItem('3d_user', n); 
            document.getElementById('loginScreen').style.display = 'none'; 
            render(); 
        };
        
        window.logout = () => { 
            localStorage.removeItem('3d_user'); 
            location.reload(); 
        };
        
        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active', 'text-sky-400'));
            document.querySelector(`[data-tab="${id}"]`).classList.add('active', 'text-sky-400');
        };

        window.toast = (m) => {
            const t = document.getElementById('toast'); t.innerText = m; t.style.opacity = 1; t.style.transform = "translate(-50%, 0)";
            setTimeout(() => { t.style.opacity = 0; t.style.transform = "translate(-50%, 20px)"; }, 2500);
        };

        window.suggestPrice = async () => {
            const name = document.getElementById('catName').value;
            if(!name) return window.toast("הקלד שם קודם");
            const btn = document.getElementById('priceAiBtn');
            btn.innerText = "...";
            try {
                const prompt = `Suggest a fair retail price in ILS for a 3D printed model: "${name}". 
                The price MUST be between 5 and 15 ILS. Output ONLY the number.`;
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                let priceText = data.candidates?.[0]?.content?.parts?.[0]?.text || "10";
                let price = parseInt(priceText.match(/\d+/)?.[0] || "10");
                
                if(price > 15) price = 15; 
                if(price < 5) price = 5; 
                
                document.getElementById('catPrice').value = price;
                window.toast(`הצעה: ${price}₪`);
            } catch(e) { window.toast("שגיאה ב-AI"); }
            finally { btn.innerText = "הצע מחיר ✨"; }
        };

        window.generateAiImage = async () => {
            const name = document.getElementById('catName').value;
            if(!name) return window.toast("הכנס שם דגם לתמונה");
            const btn = document.getElementById('imageAiBtn');
            const preview = document.getElementById('imagePreview');
            btn.innerText = "מייצר תמונה...";
            preview.innerHTML = '<div class="animate-pulse">מייצר תמונה ב-AI...</div>';
            
            try {
                const prompt = `A clean, 3D printed plastic model of ${name} on a white minimalist background, macro photography, high detail.`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instances: { prompt }, parameters: { sampleCount: 1 } })
                });
                const result = await response.json();
                const b64 = result.predictions[0].bytesBase64Encoded;
                window.state.tempImage = `data:image/png;base64,${b64}`;
                preview.innerHTML = `<img src="${window.state.tempImage}" class="w-full h-full object-cover">`;
                window.toast("תמונה נוצרה!");
            } catch (e) {
                window.toast("שגיאה ביצירת תמונה");
                preview.innerHTML = "שגיאה";
            } finally {
                btn.innerText = "🖼️ צור תמונה עם AI";
            }
        };

        window.addCatalogItem = async () => {
            if (!auth.currentUser) return;
            const name = document.getElementById('catName').value;
            const price = document.getElementById('catPrice').value;
            if(!name || !price) return window.toast("מלא פרטים");
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'products'), { 
                name, price: parseFloat(price), image: window.state.tempImage, timestamp: Date.now() 
            });
            document.getElementById('catName').value = ''; document.getElementById('catPrice').value = ''; document.getElementById('imagePreview').innerHTML = 'התמונה תופיע כאן';
            window.state.tempImage = null; window.toast("נוסף לקטלוג!");
        };

        window.addOrder = async () => {
            if (!auth.currentUser) return;
            const cust = document.getElementById('orderCust').value;
            const select = document.getElementById('orderItemSelect');
            const paid = parseFloat(document.getElementById('orderPaid').value) || 0;
            if(!cust || !select.value) return window.toast("חסרים פרטים");
            const cost = parseFloat(select.value);
            const itemName = select.options[select.selectedIndex].text.split(' (')[0];
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'orders'), {
                customer: cust, item: itemName, cost, paid, phone: document.getElementById('orderPhone').value,
                done: paid >= cost, printer: "טרם", timestamp: Date.now(), date: new Date().toLocaleDateString('he-IL'), seller: window.state.user
            });
            document.getElementById('orderCust').value = ''; document.getElementById('orderPhone').value = ''; document.getElementById('orderPaid').value = '';
            window.toast("נשמר בענן!");
        };

        window.addExpense = async () => {
            if (!auth.currentUser) return;
            const name = document.getElementById('expName').value; 
            const price = parseFloat(document.getElementById('expPrice').value);
            if(!name || !price) return window.toast("חסר מחיר");
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'expenses'), { 
                name, price, buyer: window.state.user, timestamp: Date.now() 
            });
            document.getElementById('expName').value = ''; document.getElementById('expPrice').value = ''; window.toast("הוצאה נרשמה");
        };

        window.updatePrinter = async (id, val) => { 
            if (!auth.currentUser) return;
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', id), { printer: val }); 
        };
        
        window.markPaid = async (id, cost) => { 
            if (!auth.currentUser) return;
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', id), { paid: cost, done: true }); 
        };

        window.render = () => {
            if(!window.state.user) return;
            document.getElementById('currentUserDisplay').innerText = `מחובר: ${window.state.user}`;
            const s = document.getElementById('orderItemSelect');
            s.innerHTML = '<option value="">בחר מוצר...</option>' + window.state.products.map(p => `<option value="${p.price}">${p.name} (${p.price}₪)</option>`).join('');
            
            document.getElementById('orderList').innerHTML = window.state.orders.map(o => `
                <div class="glass p-5 rounded-3xl border-r-4 ${o.done ? 'border-emerald-500' : 'border-rose-500'}">
                    <div class="flex justify-between items-start">
                        <div><div class="font-bold text-lg">${o.customer}</div><div class="text-sky-400 text-[10px] font-bold uppercase">${o.item}</div></div>
                        <div class="text-right"><div class="text-xl font-black">${o.paid}/${o.cost}₪</div><div class="text-[9px] text-slate-500">${o.date}</div></div>
                    </div>
                    <div class="flex gap-2 mt-4">
                        ${!o.done ? `<button onclick="markPaid('${o.id}', ${o.cost})" class="flex-1 bg-white/5 py-2 rounded-xl text-[10px] font-bold">סמן שולם</button>` : ''}
                        <button onclick="window.open('https://wa.me/972${o.phone?.replace(/^0/,'')}?text=היי ${o.customer}, ההזמנה מוכנה')" class="bg-emerald-500/10 text-emerald-400 p-2 rounded-xl"><i data-lucide="message-circle" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `).join('');

            document.getElementById('prodList').innerHTML = window.state.orders.map(o => `
                <div class="glass p-4 rounded-2xl flex justify-between items-center">
                    <div><div class="font-bold text-sm">${o.item}</div><div class="text-[10px] text-slate-500">${o.customer}</div></div>
                    <select onchange="updatePrinter('${o.id}', this.value)" class="!w-32 !py-1 !text-[11px] !rounded-xl !h-10">
                        <option value="טרם" ${o.printer === 'טרם' ? 'selected' : ''}>⏳ טרם נקבע</option>
                        <option value="עמוס" ${o.printer === 'עמוס' ? 'selected' : ''}>👤 עמוס</option>
                        <option value="מעיין" ${o.printer === 'מעיין' ? 'selected' : ''}>👤 מעיין</option>
                    </select>
                </div>
            `).join('');

            document.getElementById('catalogList').innerHTML = window.state.products.map(p => `
                <div class="glass p-3 rounded-2xl flex items-center gap-3">
                    <div class="w-12 h-12 rounded-lg bg-slate-800 overflow-hidden flex items-center justify-center">${p.image ? `<img src="${p.image}" class="w-full h-full object-cover">` : `<i data-lucide="image" class="w-4 h-4 opacity-20"></i>`}</div>
                    <div class="flex-1"><div class="font-bold text-sm">${p.name}</div><div class="text-emerald-400 text-[10px] font-bold">${p.price}₪</div></div>
                </div>
            `).join('');

            const r = window.state.orders.reduce((a,b)=>a+(b.paid||0),0);
            const e = window.state.expenses.reduce((a,b)=>a+(b.price||0),0);
            document.getElementById('stat-profit').innerText = (r - e) + " ₪";
            document.getElementById('stat-revenue').innerText = r + " ₪";
            document.getElementById('stat-expenses').innerText = e + " ₪";
            lucide.createIcons();
        };
        lucide.createIcons();
    </script>
</body>
</html>
