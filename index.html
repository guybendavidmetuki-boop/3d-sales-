<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Cloud Manager PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617; 
            color: white; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden; 
        }
        .glass { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .tab-content { 
            display: none; 
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .tab-content.active { 
            display: block; 
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        input, select { 
            background: #0f172a !important; 
            border: 1px solid #1e293b !important; 
            color: white !important; 
            padding: 16px !important; 
            border-radius: 20px !important; 
            outline: none; 
            width: 100%; 
            font-size: 16px;
            transition: all 0.2s;
        }
        input:focus { 
            border-color: #38bdf8 !important; 
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.1); 
        }
        .nav-btn { transition: all 0.3s; color: #64748b; }
        .nav-btn.active { color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .btn-ready { background: linear-gradient(135deg, #10b981, #059669); }
        
        .status-badge { font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 6px; text-transform: uppercase; }
        .status-pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .status-done { background: rgba(16, 185, 129, 0.1); color: #10b981; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="pb-32">

    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 glass px-6 py-3 rounded-full text-xs font-bold opacity-0 transition-all z-[300] border-sky-500/40 pointer-events-none"></div>

    <div id="app" class="max-w-md mx-auto p-6 pt-10">
        
        <!-- Login Screen -->
        <div id="loginScreen" class="fixed inset-0 z-[200] bg-slate-950 flex items-center justify-center p-6" style="display:none;">
            <div class="glass p-10 rounded-[45px] w-full max-w-sm text-center border-white/10 shadow-2xl">
                <div class="w-20 h-20 bg-sky-500 rounded-[25px] mx-auto mb-8 flex items-center justify-center shadow-2xl shadow-sky-500/20">
                    <i data-lucide="cloud" class="w-10 h-10 text-white"></i>
                </div>
                <h2 class="text-3xl font-black mb-10 tracking-tight">מי מנהל היום?</h2>
                <div class="grid gap-4">
                    <button onclick="loginUser('עמוס')" class="p-6 rounded-3xl bg-white/5 text-xl font-bold border border-white/10 active:scale-95 transition-all hover:bg-white/10">עמוס</button>
                    <button onclick="loginUser('מעיין')" class="p-6 rounded-3xl bg-white/5 text-xl font-bold border border-white/10 active:scale-95 transition-all hover:bg-white/10">מעיין</button>
                </div>
            </div>
        </div>

        <header class="flex justify-between items-center mb-10 px-2">
            <div>
                <p id="currentUserDisplay" class="text-sky-400 text-[10px] font-black mb-1 uppercase tracking-widest"></p>
                <div class="flex items-center gap-2">
                    <h1 class="text-3xl font-black tracking-tighter">ניהול ענן</h1>
                    <div id="cloudStatus" class="w-2 h-2 rounded-full bg-slate-700"></div>
                </div>
            </div>
            <button onclick="logout()" class="w-12 h-12 glass rounded-2xl flex items-center justify-center text-slate-500 hover:text-white transition-colors">
                <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
        </header>

        <!-- Tabs -->
        <div id="tab-sales" class="tab-content active space-y-8">
            <section class="glass p-7 rounded-[40px] space-y-4">
                <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-widest">מכירה חדשה</h3>
                <input type="text" id="orderCust" placeholder="שם הלקוח">
                <input type="tel" id="orderPhone" placeholder="טלפון לקוח (אופציונלי)">
                <select id="orderItemSelect"><option value="">טוען קטלוג...</option></select>
                <input type="number" id="orderPaid" placeholder="כמה שולם? (₪)">
                <button onclick="addOrder()" class="w-full bg-sky-500 py-5 rounded-[22px] font-black text-lg shadow-xl shadow-sky-500/20 active:scale-[0.98] transition-all">שמור לענן 🚀</button>
            </section>
            <div id="orderList" class="space-y-4"></div>
        </div>

        <div id="tab-prod" class="tab-content space-y-6">
            <h2 class="text-2xl font-black tracking-tight px-2 text-sky-400">תור הדפסות חי</h2>
            <div id="prodList" class="space-y-4"></div>
        </div>

        <div id="tab-catalog" class="tab-content space-y-8">
            <section class="glass p-7 rounded-[40px] space-y-5">
                <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-widest">הוספה לקטלוג (עד 15₪)</h3>
                <input type="text" id="catName" placeholder="שם המוצר">
                
                <div class="flex gap-2">
                    <button onclick="suggestPrice()" class="bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-4 rounded-2xl text-[10px] font-bold shrink-0">הצע מחיר AI ✨</button>
                    <input type="number" id="catPrice" placeholder="מחיר (₪)" class="flex-1">
                </div>

                <!-- AI Image Canvas Container -->
                <div id="imageContainer" class="aspect-square glass rounded-3xl flex items-center justify-center overflow-hidden border-2 border-dashed border-white/10 relative">
                    <canvas id="aiCanvas" width="400" height="400" class="w-full h-full hidden"></canvas>
                    <div id="canvasPlaceholder" class="text-slate-500 text-[10px] italic text-center px-4">התמונה תופיע כאן</div>
                </div>

                <button onclick="generateAiImage()" class="w-full glass bg-white/5 text-white py-4 rounded-[20px] text-xs font-bold border border-white/10 flex items-center justify-center gap-2">
                    <i data-lucide="palette" class="w-4 h-4 text-emerald-400"></i>
                    <span>צור תמונה עם AI</span>
                </button>
                
                <button onclick="addCatalogItem()" class="w-full bg-emerald-500 py-5 rounded-[22px] font-black text-lg active:scale-[0.98] transition-all">הוסף לקטלוג המשותף</button>
            </section>
            <div id="catalogList" class="grid grid-cols-2 gap-4"></div>
        </div>

        <div id="tab-money" class="tab-content space-y-8">
            <div class="glass p-10 rounded-[50px] text-center border-white/5 shadow-2xl">
                <h3 class="text-[11px] font-black text-slate-500 uppercase tracking-widest mb-4">מאזן רווח נקי</h3>
                <div id="stat-profit" class="text-6xl font-black text-emerald-400 mb-6 tracking-tighter">0₪</div>
                <div class="grid grid-cols-2 gap-6 border-t border-white/5 pt-8">
                    <div><div class="text-[10px] text-slate-500 font-black">הכנסות</div><div id="stat-revenue" class="font-black text-lg">0₪</div></div>
                    <div><div class="text-[10px] text-slate-500 font-black">הוצאות</div><div id="stat-expenses" class="font-black text-lg text-rose-500">0₪</div></div>
                </div>
            </div>
            
            <section class="glass p-7 rounded-[40px] space-y-5">
                <h3 class="text-[11px] font-black text-rose-400 uppercase tracking-widest">רישום הוצאה</h3>
                <input type="text" id="expName" placeholder="מה קנינו? (למשל: פילמנט)">
                <input type="number" id="expPrice" placeholder="כמה עלה? (₪)">
                <button onclick="addExpense()" class="w-full bg-rose-500 py-5 rounded-[22px] font-black text-lg active:scale-[0.98] transition-all">הוסף הוצאה</button>
            </section>
        </div>
    </div>

    <nav class="fixed bottom-8 left-6 right-6 h-20 glass rounded-[30px] flex justify-around items-center px-4 z-[100] border-white/10 shadow-2xl">
        <button onclick="switchTab('sales')" class="nav-btn p-4 rounded-2xl active" data-tab="sales"><i data-lucide="shopping-bag"></i></button>
        <button onclick="switchTab('prod')" class="nav-btn p-4 rounded-2xl" data-tab="prod"><i data-lucide="printer"></i></button>
        <button onclick="switchTab('catalog')" class="nav-btn p-4 rounded-2xl" data-tab="catalog"><i data-lucide="layers"></i></button>
        <button onclick="switchTab('money')" class="nav-btn p-4 rounded-2xl" data-tab="money"><i data-lucide="pie-chart"></i></button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const FB_CONFIG = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const APP_ID = "3d-print-cloud-v1";
        const BASE_PATH = ['artifacts', APP_ID, 'public', 'data'];

        let db = null, auth = null;
        
        window.state = {
            user: localStorage.getItem('3d_user') || null,
            products: JSON.parse(localStorage.getItem('3d_local_products') || '[]'),
            orders: JSON.parse(localStorage.getItem('3d_local_orders') || '[]'),
            expenses: JSON.parse(localStorage.getItem('3d_local_expenses') || '[]'),
            tempImage: null,
            isConnected: false
        };

        const init = async () => {
            window.render();
            if (!FB_CONFIG) return;
            try {
                const app = initializeApp(FB_CONFIG);
                db = getFirestore(app);
                auth = getAuth(app);
                
                onAuthStateChanged(auth, (user) => {
                    if (user) setupRealtime();
                    else signInAnonymously(auth).catch(e => console.error(e));
                });
            } catch (e) { console.error(e); }
        };

        function setupRealtime() {
            const statusDot = document.getElementById('cloudStatus');
            const safeListen = (coll, key) => {
                onSnapshot(collection(db, ...BASE_PATH, coll), s => {
                    const data = s.docs.map(d => ({id: d.id, ...d.data()}));
                    window.state[key] = data;
                    localStorage.setItem(`3d_local_${key}`, JSON.stringify(data));
                    window.state.isConnected = true;
                    statusDot.className = 'w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]';
                    window.render();
                }, (err) => {
                    statusDot.className = 'w-2 h-2 rounded-full bg-amber-500';
                });
            };
            safeListen('products', 'products');
            safeListen('orders', 'orders');
            safeListen('expenses', 'expenses');
        }

        window.loginUser = (n) => {
            window.state.user = n;
            localStorage.setItem('3d_user', n);
            window.render();
            window.toast(`שלום ${n}!`);
        };

        window.logout = () => { localStorage.removeItem('3d_user'); location.reload(); };

        window.toast = (m) => {
            const t = document.getElementById('toast'); 
            t.innerText = m; 
            t.style.opacity = 1; 
            t.style.transform = "translate(-50%, 0)";
            setTimeout(() => { t.style.opacity = 0; t.style.transform = "translate(-50%, 20px)"; }, 2500);
        };

        window.suggestPrice = () => {
            const name = document.getElementById('catName').value;
            if(!name) return window.toast("הכנס שם מוצר קודם");
            const price = Math.min(Math.floor(Math.random() * 8) + 7, 15);
            document.getElementById('catPrice').value = price;
            window.toast(`הצעה AI: ${price}₪`);
        };

        // INTERNAL AI IMAGE GENERATOR (CANVAS BASED)
        window.generateAiImage = () => {
            const name = document.getElementById('catName').value;
            if(!name) return window.toast("הכנס שם מוצר");

            const canvas = document.getElementById('aiCanvas');
            const placeholder = document.getElementById('canvasPlaceholder');
            const ctx = canvas.getContext('2d');
            
            placeholder.innerText = "מעבד נתונים...";
            canvas.classList.add('hidden');

            setTimeout(() => {
                // Background
                ctx.fillStyle = "#0f172a";
                ctx.fillRect(0, 0, 400, 400);

                // Grid Lines
                ctx.strokeStyle = "rgba(56, 189, 248, 0.1)";
                ctx.lineWidth = 1;
                for(let i=0; i<400; i+=40) {
                    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 400); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(400, i); ctx.stroke();
                }

                // Blueprint Box
                ctx.strokeStyle = "#38bdf8";
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(80, 80, 240, 240);
                ctx.setLineDash([]);

                // 3D Box Effect
                ctx.strokeStyle = "#38bdf8";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(120, 150); ctx.lineTo(280, 150);
                ctx.lineTo(280, 280); ctx.lineTo(120, 280); ctx.closePath();
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(150, 120); ctx.lineTo(310, 120);
                ctx.lineTo(310, 250); ctx.lineTo(280, 280);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(310, 120); ctx.lineTo(280, 150);
                ctx.stroke();

                // Text (Hebrew Support)
                ctx.fillStyle = "white";
                ctx.font = "bold 24px Inter, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(name, 200, 360);
                
                ctx.fillStyle = "rgba(56, 189, 248, 0.5)";
                ctx.font = "black 12px Inter, sans-serif";
                ctx.fillText("3D CLOUD RENDER v2.0", 200, 40);

                window.state.tempImage = canvas.toDataURL("image/png");
                canvas.classList.remove('hidden');
                placeholder.classList.add('hidden');
                window.toast("הדמיה נוצרה!");
            }, 600);
        };

        window.markAsDone = async (id) => {
            if(window.state.isConnected && db) {
                await updateDoc(doc(db, ...BASE_PATH, 'orders', id), { status: "✅ מוכן" });
            } else {
                const order = window.state.orders.find(o => o.id === id);
                if(order) order.status = "✅ מוכן";
                localStorage.setItem('3d_local_orders', JSON.stringify(window.state.orders));
                window.render();
            }
            window.toast("מוכן למסירה!");
        };

        window.addOrder = async () => {
            const cust = document.getElementById('orderCust').value;
            const phone = document.getElementById('orderPhone').value;
            const select = document.getElementById('orderItemSelect');
            const paid = parseFloat(document.getElementById('orderPaid').value) || 0;
            
            if(!cust || !select.value) return window.toast("מלא פרטי הזמנה");
            
            const newOrder = {
                customer: cust, 
                phone, 
                item: select.options[select.selectedIndex].text.split(' (')[0],
                cost: parseFloat(select.value), 
                paid,
                status: "⏳ בתור", 
                seller: window.state.user,
                timestamp: Date.now(), 
                date: new Date().toLocaleDateString('he-IL')
            };

            if(window.state.isConnected && db) {
                await addDoc(collection(db, ...BASE_PATH, 'orders'), newOrder);
            } else saveLocal('orders', newOrder);
            
            document.getElementById('orderCust').value = ""; 
            document.getElementById('orderPaid').value = ""; 
            document.getElementById('orderPhone').value = "";
            window.toast("הזמנה נשמרה!");
        };

        window.addCatalogItem = async () => {
            const name = document.getElementById('catName').value;
            let price = parseFloat(document.getElementById('catPrice').value);
            if(!name || !price) return window.toast("מלא שם ומחיר");
            if(price > 15) price = 15;

            const newItem = { name, price, image: window.state.tempImage, timestamp: Date.now() };

            if(window.state.isConnected && db) {
                await addDoc(collection(db, ...BASE_PATH, 'products'), newItem);
            } else saveLocal('products', newItem);

            document.getElementById('catName').value = ""; 
            document.getElementById('catPrice').value = "";
            window.state.tempImage = null; 
            document.getElementById('canvasPlaceholder').classList.remove('hidden');
            document.getElementById('aiCanvas').classList.add('hidden');
            window.toast("נוסף לקטלוג!");
        };

        window.addExpense = async () => {
            const name = document.getElementById('expName').value;
            const price = parseFloat(document.getElementById('expPrice').value);
            if(!name || !price) return window.toast("מלא פרטי הוצאה");
            
            const newExp = { name, price, timestamp: Date.now(), buyer: window.state.user };
            if(window.state.isConnected && db) await addDoc(collection(db, ...BASE_PATH, 'expenses'), newExp);
            else saveLocal('expenses', newExp);
            
            document.getElementById('expName').value = ""; 
            document.getElementById('expPrice').value = "";
            window.toast("הוצאה נרשמה!");
        };

        function saveLocal(key, item) {
            item.id = 'local_' + Date.now();
            window.state[key].unshift(item);
            localStorage.setItem(`3d_local_${key}`, JSON.stringify(window.state[key]));
            window.render();
        }

        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-tab="${id}"]`).classList.add('active');
        };

        window.render = () => {
            if(!window.state.user) {
                document.getElementById('loginScreen').style.display = 'flex';
                return;
            }
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('currentUserDisplay').innerText = `שלום, ${window.state.user}`;
            
            const s = document.getElementById('orderItemSelect');
            s.innerHTML = '<option value="">בחר מוצר...</option>' + 
                window.state.products.map(p => `<option value="${p.price}">${p.name} (${p.price}₪)</option>`).join('');
            
            const revenue = window.state.orders.reduce((a,b)=>a+(b.paid||0),0);
            const expenses = window.state.expenses.reduce((a,b)=>a+(b.price||0),0);
            const profit = revenue - expenses;
            
            document.getElementById('stat-profit').innerText = profit + "₪";
            document.getElementById('stat-profit').className = `text-6xl font-black mb-6 tracking-tighter ${profit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
            document.getElementById('stat-revenue').innerText = revenue + "₪";
            document.getElementById('stat-expenses').innerText = expenses + "₪";

            document.getElementById('orderList').innerHTML = [...window.state.orders].sort((a,b)=>b.timestamp-a.timestamp).map(o => `
                <div class="glass p-5 rounded-[30px] border-r-4 ${o.status === '✅ מוכן' ? 'border-emerald-500' : 'border-amber-500'}">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="font-bold text-lg">${o.customer}</div>
                            <div class="text-[10px] text-sky-400 font-bold uppercase">${o.item}</div>
                        </div>
                        <div class="text-right flex items-center gap-3">
                            ${o.phone ? `<button onclick="window.open('https://wa.me/972${o.phone.replace(/^0/,'')}?text=${encodeURIComponent('היי, הזמנת ה-3D שלך מוכנה!')}')" class="w-10 h-10 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center"><i data-lucide="message-circle" class="w-5 h-5"></i></button>` : ''}
                            <div class="font-black text-xl">${o.paid}₪</div>
                        </div>
                    </div>
                </div>
            `).join('') || '<p class="text-center opacity-20 py-10">אין מכירות</p>';

            document.getElementById('prodList').innerHTML = window.state.orders.filter(o => o.status !== "✅ מוכן").map(o => `
                <div class="glass p-5 rounded-[30px] flex justify-between items-center">
                    <div><div class="font-bold">${o.item}</div><div class="text-[11px] text-slate-400">${o.customer}</div></div>
                    <button onclick="markAsDone('${o.id}')" class="w-12 h-12 rounded-2xl btn-ready text-white flex items-center justify-center shadow-lg"><i data-lucide="check" class="w-6 h-6"></i></button>
                </div>
            `).join('') || '<p class="text-center opacity-20 py-10">הכל מודפס!</p>';

            document.getElementById('catalogList').innerHTML = window.state.products.map(p => `
                <div class="glass p-3 rounded-[30px] space-y-2 group">
                    <div class="aspect-square rounded-2xl overflow-hidden bg-slate-800">
                        <img src="${p.image || 'https://placehold.co/300x300/0f172a/334155?text=3D'}" class="w-full h-full object-cover">
                    </div>
                    <div class="px-1 flex justify-between items-center">
                        <div class="font-bold text-[10px] truncate">${p.name}</div>
                        <div class="text-emerald-400 font-black text-xs">${p.price}₪</div>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        };

        window.onload = init;
    </script>
</body>
</html>
