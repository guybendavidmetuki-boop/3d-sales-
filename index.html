<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Cloud Manager PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617; 
            color: white; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden; 
        }
        .glass { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .tab-content { 
            display: none; 
            animation: fadeIn 0.3s ease-out; 
        }
        .tab-content.active { 
            display: block; 
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(5px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        input, select { 
            background: #0f172a !important; 
            border: 1px solid #1e293b !important; 
            color: white !important; 
            padding: 14px !important; 
            border-radius: 18px !important; 
            outline: none; 
            width: 100%; 
            font-size: 16px;
        }
        .nav-btn { transition: all 0.3s; color: #64748b; }
        .nav-btn.active { color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
    </style>
</head>
<body class="pb-32">
    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 glass px-6 py-3 rounded-full text-xs font-bold opacity-0 transition-all z-[300] border-sky-500/40 pointer-events-none"></div>

    <div id="app" class="max-w-md mx-auto p-6 pt-10">
        
        <div id="loginScreen" class="fixed inset-0 z-[200] bg-slate-950 flex items-center justify-center p-6" style="display:flex;">
            <div class="glass p-10 rounded-[45px] w-full max-w-sm text-center border-white/10 shadow-2xl">
                <div class="w-20 h-20 bg-sky-500 rounded-[25px] mx-auto mb-8 flex items-center justify-center shadow-2xl shadow-sky-500/20">
                    <i data-lucide="cloud" class="w-10 h-10 text-white"></i>
                </div>
                <h2 class="text-3xl font-black mb-10 tracking-tight">מי מנהל היום?</h2>
                <div class="grid gap-4">
                    <button onclick="loginUser('עמוס')" class="p-6 rounded-3xl bg-white/5 text-xl font-bold border border-white/10 active:scale-95 transition-all">עמוס</button>
                    <button onclick="loginUser('מעיין')" class="p-6 rounded-3xl bg-white/5 text-xl font-bold border border-white/10 active:scale-95 transition-all">מעיין</button>
                </div>
            </div>
        </div>

        <header class="flex justify-between items-center mb-10 px-2">
            <div>
                <p id="currentUserDisplay" class="text-sky-400 text-[10px] font-black mb-1 uppercase tracking-widest"></p>
                <div class="flex items-center gap-2">
                    <h1 class="text-3xl font-black tracking-tighter">ניהול ענן</h1>
                    <div id="cloudStatus" class="w-2 h-2 rounded-full bg-amber-500"></div>
                </div>
            </div>
            <button onclick="logout()" class="w-12 h-12 glass rounded-2xl flex items-center justify-center text-slate-500 hover:text-white">
                <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
        </header>

        <div id="tab-sales" class="tab-content active space-y-8">
            <section class="glass p-7 rounded-[40px] space-y-4">
                <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-widest">מכירה חדשה</h3>
                <input type="text" id="orderCust" placeholder="שם הלקוח">
                <input type="tel" id="orderPhone" placeholder="טלפון (למשל: 0501234567)">
                <select id="orderItemSelect"><option value="">טוען מוצרים...</option></select>
                <input type="number" id="orderPaid" placeholder="כמה שולם? (₪)">
                <button onclick="addOrder()" class="w-full bg-sky-500 py-5 rounded-[22px] font-black text-lg shadow-xl shadow-sky-500/20 active:scale-[0.98]">שמור הזמנה ✨</button>
            </section>
            <div id="orderList" class="space-y-4"></div>
        </div>

        <div id="tab-prod" class="tab-content space-y-6">
            <h2 class="text-2xl font-black tracking-tight px-2 text-sky-400">תור הדפסות</h2>
            <div id="prodList" class="space-y-4"></div>
        </div>

        <div id="tab-catalog" class="tab-content space-y-8">
            <section class="glass p-7 rounded-[40px] space-y-5">
                <h3 class="text-[11px] font-black text-slate-400 uppercase tracking-widest">הוספת מוצר לקטלוג</h3>
                <input type="text" id="catName" placeholder="שם המוצר (למשל: דרקון)">
                <input type="number" id="catPrice" placeholder="מחיר קבוע (₪)">
                <button onclick="addCatalogItem()" class="w-full bg-emerald-500 py-5 rounded-[22px] font-black text-lg active:scale-[0.98]">הוסף לקטלוג</button>
            </section>
            <div id="catalogList" class="grid grid-cols-1 gap-4"></div>
        </div>

        <div id="tab-money" class="tab-content space-y-8">
            <div class="glass p-10 rounded-[50px] text-center border-white/5">
                <h3 class="text-[11px] font-black text-slate-500 uppercase tracking-widest mb-4">רווח נקי</h3>
                <div id="stat-profit" class="text-6xl font-black text-emerald-400 mb-6 tracking-tighter">0₪</div>
                <div class="grid grid-cols-2 gap-6 border-t border-white/5 pt-8">
                    <div><div class="text-[10px] text-slate-500 font-black">הכנסות</div><div id="stat-revenue" class="font-black text-lg">0₪</div></div>
                    <div><div class="text-[10px] text-slate-500 font-black">הוצאות</div><div id="stat-expenses" class="font-black text-lg text-rose-500">0₪</div></div>
                </div>
            </div>
            
            <section class="glass p-7 rounded-[40px] space-y-5">
                <input type="text" id="expName" placeholder="תיאור הוצאה">
                <input type="number" id="expPrice" placeholder="סכום (₪)">
                <button onclick="addExpense()" class="w-full bg-rose-500 py-5 rounded-[22px] font-black text-lg">הוסף הוצאה</button>
            </section>
        </div>
    </div>

    <nav class="fixed bottom-8 left-6 right-6 h-20 glass rounded-[30px] flex justify-around items-center px-4 z-[100] border-white/10 shadow-2xl">
        <button onclick="switchTab('sales')" class="nav-btn p-4 rounded-2xl active" data-tab="sales"><i data-lucide="shopping-bag"></i></button>
        <button onclick="switchTab('prod')" class="nav-btn p-4 rounded-2xl" data-tab="prod"><i data-lucide="printer"></i></button>
        <button onclick="switchTab('catalog')" class="nav-btn p-4 rounded-2xl" data-tab="catalog"><i data-lucide="layers"></i></button>
        <button onclick="switchTab('money')" class="nav-btn p-4 rounded-2xl" data-tab="money"><i data-lucide="pie-chart"></i></button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        window.state = {
            user: localStorage.getItem('3d_user') || null,
            products: JSON.parse(localStorage.getItem('3d_local_products') || '[]'),
            orders: JSON.parse(localStorage.getItem('3d_local_orders') || '[]'),
            expenses: JSON.parse(localStorage.getItem('3d_local_expenses') || '[]'),
            mode: 'local'
        };

        let db = null;
        const APP_ID = "3d-cloud-v1";
        const BASE_PATH = ['artifacts', APP_ID, 'public', 'data'];

        window.toast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2000);
        };

        window.loginUser = (name) => {
            window.state.user = name;
            localStorage.setItem('3d_user', name);
            document.getElementById('loginScreen').style.display = 'none';
            window.render();
        };

        window.logout = () => {
            window.state.user = null;
            localStorage.removeItem('3d_user');
            document.getElementById('loginScreen').style.display = 'flex';
        };

        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-tab="${id}"]`).classList.add('active');
        };

        window.addOrder = async () => {
            const cust = document.getElementById('orderCust').value;
            const phone = document.getElementById('orderPhone').value;
            const select = document.getElementById('orderItemSelect');
            const paid = parseFloat(document.getElementById('orderPaid').value) || 0;
            
            if(!cust || !select.value) return window.toast("מלא שם ומוצר");
            
            const newOrder = {
                customer: cust, phone, item: select.options[select.selectedIndex].text.split(' (')[0],
                cost: parseFloat(select.value), paid, status: "⏳ בתור", seller: window.state.user, timestamp: Date.now()
            };

            try {
                if(db && window.state.mode === 'cloud') {
                    await addDoc(collection(db, ...BASE_PATH, 'orders'), newOrder);
                } else { throw "local"; }
            } catch (e) {
                newOrder.id = 'L' + Date.now();
                window.state.orders.unshift(newOrder);
                localStorage.setItem('3d_local_orders', JSON.stringify(window.state.orders));
            }
            
            document.getElementById('orderCust').value = "";
            document.getElementById('orderPaid').value = "";
            window.toast("הזמנה נשמרה!");
            window.render();
        };

        window.markAsDone = async (id) => {
            try {
                if(db && window.state.mode === 'cloud') {
                    await updateDoc(doc(db, ...BASE_PATH, 'orders', id), { status: "✅ מוכן" });
                } else { throw "local"; }
            } catch (e) {
                const o = window.state.orders.find(x => x.id === id);
                if(o) o.status = "✅ מוכן";
                localStorage.setItem('3d_local_orders', JSON.stringify(window.state.orders));
            }
            window.render();
        };

        window.addCatalogItem = async () => {
            const name = document.getElementById('catName').value;
            const price = parseFloat(document.getElementById('catPrice').value);
            if(!name || !price) return window.toast("מלא שם ומחיר");

            const newItem = { name, price, timestamp: Date.now() };

            try {
                if(db && window.state.mode === 'cloud') {
                    await addDoc(collection(db, ...BASE_PATH, 'products'), newItem);
                } else { throw "local"; }
            } catch (e) {
                newItem.id = 'LP' + Date.now();
                window.state.products.unshift(newItem);
                localStorage.setItem('3d_local_products', JSON.stringify(window.state.products));
            }

            document.getElementById('catName').value = ""; 
            document.getElementById('catPrice').value = "";
            window.toast("מוצר נוסף לקטלוג!");
            window.render();
        };

        window.addExpense = async () => {
            const name = document.getElementById('expName').value;
            const price = parseFloat(document.getElementById('expPrice').value);
            if(!name || !price) return window.toast("מלא פרטים");
            const exp = { name, price, timestamp: Date.now() };
            try {
                if(db && window.state.mode === 'cloud') await addDoc(collection(db, ...BASE_PATH, 'expenses'), exp);
                else throw "local";
            } catch(e) {
                exp.id = 'LE' + Date.now();
                window.state.expenses.unshift(exp);
                localStorage.setItem('3d_local_expenses', JSON.stringify(window.state.expenses));
            }
            document.getElementById('expName').value = ""; document.getElementById('expPrice').value = "";
            window.render();
        };

        window.render = () => {
            if(!window.state.user) {
                document.getElementById('loginScreen').style.display = 'flex';
                return;
            }
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('currentUserDisplay').innerText = `מחובר: ${window.state.user}`;
            
            // Dropdown
            const s = document.getElementById('orderItemSelect');
            s.innerHTML = '<option value="">בחר מוצר מהקטלוג...</option>' + 
                window.state.products.map(p => `<option value="${p.price}">${p.name} (${p.price}₪)</option>`).join('');
            
            // Stats
            const revenue = window.state.orders.reduce((a,b)=>a+(b.paid||0),0);
            const expenses = window.state.expenses.reduce((a,b)=>a+(b.price||0),0);
            const profit = revenue - expenses;
            document.getElementById('stat-profit').innerText = profit + "₪";
            document.getElementById('stat-profit').style.color = profit >= 0 ? '#34d399' : '#f87171';
            document.getElementById('stat-revenue').innerText = revenue + "₪";
            document.getElementById('stat-expenses').innerText = expenses + "₪";

            // Order List
            document.getElementById('orderList').innerHTML = [...window.state.orders].sort((a,b)=>b.timestamp-a.timestamp).map(o => `
                <div class="glass p-5 rounded-[30px] border-r-4 ${o.status === '✅ מוכן' ? 'border-emerald-500' : 'border-amber-500'}">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="font-bold text-lg">${o.customer}</div>
                            <div class="text-[10px] text-sky-400 font-bold uppercase">${o.item}</div>
                        </div>
                        <div class="flex items-center gap-3">
                            ${o.phone ? `<button onclick="window.open('https://wa.me/972${o.phone.replace(/^0/,'')}?text=${encodeURIComponent('היי ' + o.customer + ', ההזמנה שלך מוכנה! ✨')}')" class="w-10 h-10 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center"><i data-lucide="message-circle" class="w-5 h-5"></i></button>` : ''}
                            <div class="font-black text-xl">${o.paid}₪</div>
                        </div>
                    </div>
                </div>
            `).join('') || '<p class="text-center opacity-20 py-10">אין מכירות עדיין</p>';

            // Production List
            document.getElementById('prodList').innerHTML = window.state.orders.filter(o => o.status !== "✅ מוכן").map(o => `
                <div class="glass p-5 rounded-[30px] flex justify-between items-center">
                    <div><div class="font-bold text-lg">${o.item}</div><div class="text-[11px] text-slate-400">לקוח: ${o.customer}</div></div>
                    <button onclick="markAsDone('${o.id || o.timestamp}')" class="w-14 h-14 rounded-2xl bg-emerald-500 text-white flex items-center justify-center shadow-lg active:scale-90"><i data-lucide="check" class="w-8 h-8"></i></button>
                </div>
            `).join('') || '<p class="text-center opacity-20 py-10">תור ריק ✅</p>';

            // Catalog List (Text only)
            document.getElementById('catalogList').innerHTML = window.state.products.map(p => `
                <div class="glass p-5 rounded-[25px] flex justify-between items-center">
                    <div class="font-bold text-lg">${p.name}</div>
                    <div class="text-emerald-400 font-black text-xl">${p.price}₪</div>
                </div>
            `).join('') || '<p class="text-center opacity-20 py-10">הקטלוג ריק</p>';

            lucide.createIcons();
        };

        const start = async () => {
            window.render();
            const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            if(!config) return;

            try {
                const app = initializeApp(config);
                db = getFirestore(app);
                const auth = getAuth(app);
                onAuthStateChanged(auth, user => {
                    if (user) {
                        window.state.mode = 'cloud';
                        document.getElementById('cloudStatus').className = 'w-2 h-2 rounded-full bg-emerald-500';
                        onSnapshot(collection(db, ...BASE_PATH, 'orders'), s => { window.state.orders = s.docs.map(d=>({id:d.id, ...d.data()})); window.render(); });
                        onSnapshot(collection(db, ...BASE_PATH, 'products'), s => { window.state.products = s.docs.map(d=>({id:d.id, ...d.data()})); window.render(); });
                        onSnapshot(collection(db, ...BASE_PATH, 'expenses'), s => { window.state.expenses = s.docs.map(d=>({id:d.id, ...d.data()})); window.render(); });
                    } else { signInAnonymously(auth); }
                });
            } catch(e) { console.warn("Cloud Error, running Local mode."); }
        };

        window.onload = start;
    </script>
</body>
</html>
